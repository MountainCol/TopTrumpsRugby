
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Blacks Top Trumps</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>All Blacks Top Trumps</h1>

    <div class="game-area">

        <div class="player-area">
            <h2>Player 1</h2>
            <p>Cards left:<span id="player-one-count"></span> </p>
            <div id="player-1-card-area"></div>
        </div>

        <div class="player-area">
            <h2>Player 2</h2>
            <p>Cards left:<span id="player-two-count"></span> </p>
            <div id="player-2-card-area"></div>
        </div>

    </div>

    <div class="button-area">
        <h2>Choose your category to challenge!</h2>
        <p> Click a button below to choose</p>
    <!-- <button id="nextPlayer">Next Cards</button> -->
        <button id="internationalCaps" >International Caps</button>
        <button id="yearBorn">Year Born</button>
        <button id="internationalTries"> International Tries</button>
    </div>
    <script type="module" src="app.js"></script>
        
</body>
</html>
